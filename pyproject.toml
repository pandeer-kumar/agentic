[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opsagent"
version = "0.1.0"
description = "Agent that answers operational questions across many MCP servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "openai==3.58.0",
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "psycopg[binary,pool]==3.3.9",
  "duckdb==2.0.1",
  "pandas==3.1.1",
  "plotly==7.1.0",
  "pydantic-settings==2.16.3",
  "PyYAML==6.0.4",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]

[project.scripts]
opsagent = "opsagent.api:main"
opsagent-mock-azure = "opsagent.mocks.azure:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsagent = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
